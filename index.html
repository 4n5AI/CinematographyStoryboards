<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="映像制作のためのシネマトグラフィー用語辞典。ショットサイズ、アングル、カメラムーブ、レンズ、時間、照明、構図の7軸66用語を絵コンテで解説。">
  <meta name="theme-color" content="#0b0c0e">
  <title>CINEMATOGRAPHY REFERENCE — 7軸66用語</title>
  <style>
    :root {
      --ink: #f1ede4;
      --muted: #a4a19a;
      --faint: #71716f;
      --bg: #090a0c;
      --panel: #111317;
      --panel-2: #171a1f;
      --line: rgba(255,255,255,.11);
      --line-strong: rgba(255,255,255,.2);
      --amber: #e6aa58;
      --teal: #73b9b4;
      --max: 1480px;
      --serif: "Iowan Old Style", "YuMincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
      --sans: Inter, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 118px; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 76% -10%, rgba(230,170,88,.10), transparent 30rem),
        radial-gradient(circle at -10% 40%, rgba(115,185,180,.06), transparent 28rem),
        var(--bg);
      font-family: var(--sans);
      line-height: 1.65;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .075;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }
    a { color: inherit; }
    button, input { font: inherit; }

    .hero {
      min-height: 74vh;
      display: grid;
      align-items: end;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: #080b0b;
    }
    .hero-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: .72;
      filter: saturate(.72) contrast(1.12);
    }
    .hero-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(3,5,6,.88) 0%, rgba(3,5,6,.38) 55%, rgba(3,5,6,.2) 100%),
        linear-gradient(0deg, rgba(3,5,6,.95) 0%, rgba(3,5,6,.12) 62%, rgba(3,5,6,.5) 100%);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 7% 4%;
      z-index: 1;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 2px;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 33.2%, rgba(255,255,255,.045) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.045) 66.7%, transparent 66.8%),
        linear-gradient(transparent 33.2%, rgba(255,255,255,.045) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.045) 66.7%, transparent 66.8%);
    }
    .hero-inner {
      width: min(var(--max), calc(100% - 48px));
      margin: 0 auto;
      padding: 100px 0 72px;
      position: relative;
      z-index: 2;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 24px;
      color: var(--amber);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 48px; height: 1px; background: currentColor; }
    h1 {
      max-width: 1100px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(54px, 9vw, 138px);
      font-weight: 400;
      line-height: .82;
      letter-spacing: -.055em;
    }
    h1 span { display: block; margin-left: .55em; color: transparent; -webkit-text-stroke: 1px rgba(241,237,228,.62); }
    .hero-bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 40px;
      margin-top: 54px;
    }
    .lead { max-width: 700px; margin: 0; color: #c7c3bb; font-family: var(--serif); font-size: clamp(16px, 1.5vw, 22px); }
    .stats { display: flex; gap: 34px; }
    .stat strong { display: block; color: var(--amber); font-family: var(--serif); font-size: 34px; font-weight: 400; line-height: 1; }
    .stat span { color: var(--faint); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .video-toggle {
      position: absolute;
      top: 34px;
      right: 4%;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.22);
      color: var(--ink);
      background: rgba(7,9,10,.42);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .video-toggle::before { content: "Ⅱ"; color: var(--amber); }
    .video-toggle[aria-pressed="true"]::before { content: "▶"; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(9,10,12,.88);
      backdrop-filter: blur(18px);
    }
    .toolbar-inner {
      width: min(var(--max), calc(100% - 48px));
      margin: auto;
      padding: 14px 0;
      display: grid;
      grid-template-columns: minmax(210px, 300px) minmax(0, 1fr);
      gap: 20px;
      align-items: center;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }
    .search svg { width: 15px; color: var(--faint); }
    .search input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 12px; }
    .search input::placeholder { color: var(--faint); }
    .filters { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .filter:hover { color: var(--ink); border-color: var(--line); }
    .filter[aria-pressed="true"] { color: #101114; background: var(--amber); }

    main { width: min(var(--max), calc(100% - 48px)); margin: 0 auto; }
    .axis-section { padding: 100px 0 22px; }
    .axis-head {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) minmax(260px, 430px);
      gap: 30px;
      align-items: end;
      margin-bottom: 34px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line-strong);
    }
    .axis-no { color: var(--amber); font-family: var(--serif); font-size: 18px; }
    .axis-title { margin: 0; font-family: var(--serif); font-size: clamp(34px, 4vw, 66px); font-weight: 400; letter-spacing: -.035em; line-height: .95; }
    .axis-title small { display: block; margin-top: 10px; color: var(--muted); font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .18em; }
    .axis-desc { margin: 0; color: var(--muted); font-size: 13px; }
    .term-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

    .term-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.034), rgba(255,255,255,.014));
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
      cursor: zoom-in;
      outline: none;
    }
    .term-card:hover { transform: translateY(-3px); border-color: rgba(230,170,88,.4); background: rgba(255,255,255,.045); }
    .term-card:focus-visible { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(230,170,88,.3); }
    .storyboard {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #e8e6df;
      border-bottom: 1px solid var(--line);
    }
    .storyboard::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 80px rgba(0,0,0,.12); pointer-events: none; }
    .storyboard img { width: 100%; height: 100%; display: block; object-fit: cover; filter: sepia(.06) contrast(1.03); transition: transform .5s ease; }
    .term-card:hover .storyboard img { transform: scale(1.015); }
    .card-body { padding: 24px 24px 22px; }
    .card-kicker { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; color: var(--faint); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .term-count { color: var(--amber); }
    .term-name { margin: 7px 0 4px; font-family: var(--serif); font-size: clamp(24px, 2.4vw, 36px); font-weight: 400; line-height: 1.08; letter-spacing: -.025em; }
    .term-ja { margin: 0 0 22px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .detail-grid { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--line); }
    .detail { min-width: 0; padding: 17px 16px 0 0; }
    .detail + .detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .detail-label { display: block; margin-bottom: 8px; color: var(--amber); font-size: 9px; font-weight: 800; letter-spacing: .14em; }
    .detail p { margin: 0; color: #bebbb4; font-size: 12px; line-height: 1.65; }
    .view-label {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .view-label span:last-child { color: var(--amber); }

    .term-dialog {
      width: min(1180px, calc(100% - 36px));
      max-height: calc(100dvh - 36px);
      padding: 0;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.2);
      color: var(--ink);
      background: #101216;
      box-shadow: 0 30px 100px rgba(0,0,0,.75);
    }
    .term-dialog::backdrop { background: rgba(2,3,4,.84); backdrop-filter: blur(10px); }
    .dialog-close {
      position: sticky;
      top: 14px;
      float: right;
      z-index: 3;
      width: 42px;
      height: 42px;
      margin: 14px 14px -56px 0;
      border: 1px solid rgba(255,255,255,.3);
      color: var(--ink);
      background: rgba(7,8,10,.74);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .dialog-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, .7fr); min-height: 620px; }
    .dialog-image { min-height: 100%; background: #e7e5de; }
    .dialog-image img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .dialog-copy { display: flex; flex-direction: column; justify-content: center; padding: 64px 46px 48px; }
    .dialog-axis { margin: 0 0 14px; color: var(--amber); font-size: 10px; font-weight: 800; letter-spacing: .16em; }
    .dialog-title { margin: 0; font-family: var(--serif); font-size: clamp(34px, 4vw, 58px); font-weight: 400; line-height: 1; letter-spacing: -.035em; }
    .dialog-ja { margin: 12px 0 34px; color: var(--teal); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    .dialog-details { border-top: 1px solid var(--line); }
    .dialog-detail { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .dialog-detail span { display: block; margin-bottom: 5px; color: var(--amber); font-size: 9px; font-weight: 800; letter-spacing: .14em; }
    .dialog-detail p { margin: 0; color: #cfccc5; font-size: 14px; line-height: 1.7; }

    .empty { display: none; padding: 110px 0; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); font-family: var(--serif); font-size: 28px; font-weight: 400; }
    .page-foot {
      width: min(var(--max), calc(100% - 48px));
      margin: 100px auto 0;
      padding: 30px 0 48px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .top-link { text-decoration: none; }
    mark { color: inherit; background: rgba(230,170,88,.32); }
    [hidden] { display: none !important; }

    @media (max-width: 980px) {
      .hero { min-height: 66vh; }
      .hero-bottom, .axis-head { grid-template-columns: 1fr; }
      .stats { justify-content: flex-start; }
      .toolbar-inner { grid-template-columns: 1fr; gap: 8px; }
      .axis-head { gap: 10px; }
      .axis-no { margin-bottom: 10px; }
      .term-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dialog-layout { grid-template-columns: 1fr; }
      .dialog-image { min-height: auto; }
      .dialog-copy { padding: 36px 26px 32px; }
    }
    @media (max-width: 680px) {
      html { scroll-padding-top: 145px; }
      .hero-inner, .toolbar-inner, main, .page-foot { width: min(100% - 28px, var(--max)); }
      .hero-inner { padding: 70px 0 50px; }
      h1 { font-size: clamp(34px, 10.4vw, 52px); line-height: .9; letter-spacing: -.075em; }
      h1 span { margin-left: .2em; }
      .hero-bottom { margin-top: 38px; gap: 28px; }
      .stats { gap: 24px; }
      .axis-section { padding-top: 72px; }
      .term-grid { grid-template-columns: 1fr; }
      .card-body { padding: 19px 17px 18px; }
      .detail { padding: 14px 0; }
      .detail-label { margin-bottom: 4px; }
      .term-dialog { width: calc(100% - 18px); max-height: calc(100dvh - 18px); }
      .dialog-close { top: 8px; margin: 8px 8px -50px 0; }
      .page-foot { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
      .hero-media { display: none; }
      .video-toggle { display: none; }
    }
  </style>
</head>
<body id="top">
  <header class="hero">
    <video class="hero-media" id="heroVideo" autoplay muted loop playsinline preload="metadata" poster="assets/media/hero-poster.jpg" aria-hidden="true">
      <source src="assets/media/hero-film.mp4" type="video/mp4">
    </video>
    <div class="hero-shade" aria-hidden="true"></div>
    <button class="video-toggle" id="videoToggle" type="button" aria-pressed="false" aria-label="背景動画を一時停止">Pause film</button>
    <div class="hero-inner">
      <p class="eyebrow">Visual language for filmmakers</p>
      <h1>CINEMATOGRAPHY <span>REFERENCE</span></h1>
      <div class="hero-bottom">
        <p class="lead">映像制作のためのシネマトグラフィー用語辞典。ショットサイズから構図まで、画づくりの語彙を7つの軸と絵コンテで読み解く。</p>
        <div class="stats" aria-label="収録内容">
          <div class="stat"><strong>7</strong><span>visual axes</span></div>
          <div class="stat"><strong>66</strong><span>film terms</span></div>
          <div class="stat"><strong>16:9</strong><span>storyboards</span></div>
        </div>
      </div>
    </div>
  </header>

  <nav class="toolbar" aria-label="用語の検索と絞り込み">
    <div class="toolbar-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m21 21-4.5-4.5m2.5-5A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="search" type="search" placeholder="用語・効果・使い所を検索" autocomplete="off">
      </label>
      <div class="filters" id="filters" aria-label="7軸フィルター"></div>
    </div>
  </nav>

  <main id="content"></main>
  <div class="empty" id="empty"><strong>該当する用語がありません</strong>別のキーワードや軸を試してください。</div>

  <dialog class="term-dialog" id="termDialog" aria-labelledby="dialogTitle">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="詳細を閉じる">×</button>
    <div class="dialog-layout">
      <div class="dialog-image"><img id="dialogImage" src="" alt=""></div>
      <div class="dialog-copy">
        <p class="dialog-axis" id="dialogAxis"></p>
        <h2 class="dialog-title" id="dialogTitle"></h2>
        <p class="dialog-ja" id="dialogJa"></p>
        <div class="dialog-details">
          <div class="dialog-detail"><span>操作 / TRAIT</span><p id="dialogOperation"></p></div>
          <div class="dialog-detail"><span>効果・印象 / EFFECT</span><p id="dialogEffect"></p></div>
          <div class="dialog-detail"><span>使い所 / USE</span><p id="dialogUse"></p></div>
        </div>
      </div>
    </div>
  </dialog>

  <footer class="page-foot">
    <span>Cinematography Reference / 7 axes · 66 terms</span>
    <a class="top-link" href="#top">Back to top ↑</a>
  </footer>

  <script>
    const axes = [
      { id: "shot-size", no: "01", name: "SHOT SIZE", ja: "ショットサイズ", desc: "被写体をどこまで画面に入れるか。観客と人物の心理的な距離、情報量、身体性を設計する軸。" },
      { id: "angle", no: "02", name: "ANGLE", ja: "アングル", desc: "カメラをどの高さ・方向に置くか。同じ人物でも、力関係や客観性、没入感を大きく変える。" },
      { id: "camera-movement", no: "03", name: "CAMERA MOVEMENT", ja: "カメラムーブ", desc: "カメラの移動で視線と時間を導く。静けさ、臨場感、疾走感、心理変化を身体的に伝える。" },
      { id: "lens-optics", no: "04", name: "LENS & OPTICS", ja: "レンズ・光学", desc: "画角、圧縮、被写界深度、光学現象を選ぶ。空間の見え方と映像の手触りを決める軸。" },
      { id: "time-speed", no: "05", name: "TIME & SPEED", ja: "時間・速度", desc: "映像内の時間を伸縮・反転・固定する。出来事の重み、リズム、体感時間をコントロールする。" },
      { id: "lighting", no: "06", name: "LIGHTING", ja: "ライティング", desc: "光の方向、硬さ、色、量を設計する。時間帯と空気感を示し、人物の感情や物語の温度をつくる。" },
      { id: "composition", no: "07", name: "COMPOSITION", ja: "構図", desc: "画面内の形、線、余白、レイヤーを配置する。視線を誘導し、関係性と意味を一枚に定着させる。" }
    ];

    const terms = [
      ["shot-size","ECU / Extreme Close-Up","超クローズアップ","目・唇など顔の一部","感情の極致、緊張、親密さ","涙、決意の瞬間、鍵となる小物","SHOT SIZE_ECU_Extreme Close-Up.png"],
      ["shot-size","CU / Close-Up","クローズアップ","顔全体","感情表現の主役","セリフ、リアクション","SHOT SIZE_CU_Close-Up.png"],
      ["shot-size","MCU / Medium Close-Up","バストショット","胸から上","自然な対話の距離感","会話、インタビュー","SHOT SIZE_MCU_Medium Close-Up.png"],
      ["shot-size","MS / Medium Shot","ミディアムショット","腰から上","表情と動作の両立","日常芝居、掛け合い","SHOT SIZE_MS_Medium Shot.png"],
      ["shot-size","Cowboy Shot","カウボーイショット","膝上","構え・佇まいの強調","対峙シーン、ファッション","SHOT SIZE_Cowboy Shot.png"],
      ["shot-size","FS / Full Shot","フルショット","全身","動き・衣装を見せる","ダンス、アクション","SHOT SIZE_FS_Full Shot.png"],
      ["shot-size","WS / Extreme Long Shot","ワイド・大ロング","人物より環境が主","状況説明、孤独感、スケール","Establishing shot、冒頭・結末","SHOT SIZE_WS_Extreme Long Shot.png"],

      ["angle","Eye Level","アイレベル","目線の高さ","中立、共感、フラット","会話、日常の基本","ANGLE_Eye Level.png"],
      ["angle","Low Angle","ローアングル","見上げる","威圧感、強さ、カッコよさ","ヒーロー登場、権力者","ANGLE_Low Angle.png"],
      ["angle","High Angle","ハイアングル","見下ろす","弱さ、孤独、客観性","追い詰められた人物","ANGLE_High Angle.png"],
      ["angle","Bird's Eye / Top-down","真俯瞰","真上から","神視点、図形的な美","食事、群衆、幕開け・幕引き","ANGLE_Bird's Eye_Top-down.png"],
      ["angle","Worm's Eye","虫の目線","地面すれすれから見上げ","圧倒的スケール、非日常","ビル群、巨大感の演出","ANGLE_Worm's Eye.png"],
      ["angle","POV","主観ショット","登場人物の視点","没入、一体感","ホラー、恋愛の目線、体験型","ANGLE_POV.png"],
      ["angle","OTS / Over-the-Shoulder","肩越し","肩越しに相手を捉える","会話の関係性、距離感","対話、対峙シーン","ANGLE_OTS_Over-the-Shoulder.png"],
      ["angle","Dutch Angle","傾き構図","水平を傾ける","不安、狂気、非日常","サスペンス、精神的動揺","ANGLE_Dutch Angle.png"],

    ].map(([axis, name, ja, operation, effect, use, file]) => ({ axis, name, ja, operation, effect, use, file }));

    const content = document.querySelector("#content");
    const filters = document.querySelector("#filters");
    const search = document.querySelector("#search");
    const empty = document.querySelector("#empty");
    const termDialog = document.querySelector("#termDialog");
    const dialogClose = document.querySelector("#dialogClose");
    const heroVideo = document.querySelector("#heroVideo");
    const videoToggle = document.querySelector("#videoToggle");
    let selectedAxis = "all";

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) heroVideo.pause();

    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);

    function renderFilters() {
      const choices = [{ id: "all", name: "ALL · 66" }, ...axes.map(axis => ({
        id: axis.id,
        name: `${axis.name} · ${terms.filter(term => term.axis === axis.id).length}`
      }))];
      filters.innerHTML = choices.map(choice =>
        `<button class="filter" type="button" data-axis="${choice.id}" aria-pressed="${choice.id === selectedAxis}">${choice.name}</button>`
      ).join("");
    }

    function render() {
      const query = search.value.trim().toLocaleLowerCase("ja");
      let shown = 0;
      content.innerHTML = axes.map(axis => {
        if (selectedAxis !== "all" && selectedAxis !== axis.id) return "";
        const axisTerms = terms.filter(term => {
          if (term.axis !== axis.id) return false;
          const haystack = [term.name, term.ja, term.operation, term.effect, term.use].join(" ").toLocaleLowerCase("ja");
          return !query || haystack.includes(query);
        });
        if (!axisTerms.length) return "";
        shown += axisTerms.length;
        return `
          <section class="axis-section" id="${axis.id}">
            <header class="axis-head">
              <div class="axis-no">AXIS ${axis.no}</div>
              <h2 class="axis-title">${axis.name}<small>${axis.ja} · ${axisTerms.length} TERMS</small></h2>
              <p class="axis-desc">${axis.desc}</p>
            </header>
            <div class="term-grid">
              ${axisTerms.map((term, index) => `
                <article class="term-card" id="${axis.id}-${index + 1}" data-term="${terms.indexOf(term)}" role="button" tabindex="0" aria-haspopup="dialog" aria-label="${escapeHtml(term.name)}の詳細を開く">
                  <div class="storyboard">
                    <img src="${encodeURI(`assets/storyboards/${term.file}`)}" alt="${escapeHtml(term.name)}の視覚効果を説明する絵コンテ" loading="lazy" decoding="async">
                  </div>
                  <div class="card-body">
                    <div class="card-kicker"><span>${axis.name}</span><span class="term-count">${String(index + 1).padStart(2, "0")} / ${String(axisTerms.length).padStart(2, "0")}</span></div>
                    <h3 class="term-name">${escapeHtml(term.name)}</h3>
                    <p class="term-ja">${escapeHtml(term.ja)}</p>
                    <div class="detail-grid">
                      <div class="detail"><span class="detail-label">操作 / TRAIT</span><p>${escapeHtml(term.operation)}</p></div>
                      <div class="detail"><span class="detail-label">効果・印象 / EFFECT</span><p>${escapeHtml(term.effect)}</p></div>
                      <div class="detail"><span class="detail-label">使い所 / USE</span><p>${escapeHtml(term.use)}</p></div>
                    </div>
                    <div class="view-label"><span>Full reference</span><span>Open ↗</span></div>
                  </div>
                </article>
              `).join("")}
            </div>
          </section>
        `;
      }).join("");
      empty.style.display = shown ? "none" : "block";
    }

    function openTerm(index) {
      const term = terms[index];
      const axis = axes.find(item => item.id === term.axis);
      document.querySelector("#dialogAxis").textContent = `${axis.name} / ${axis.ja}`;
      document.querySelector("#dialogTitle").textContent = term.name;
      document.querySelector("#dialogJa").textContent = term.ja;
      document.querySelector("#dialogOperation").textContent = term.operation;
      document.querySelector("#dialogEffect").textContent = term.effect;
      document.querySelector("#dialogUse").textContent = term.use;
      const image = document.querySelector("#dialogImage");
      image.src = encodeURI(`assets/storyboards/${term.file}`);
      image.alt = `${term.name}の視覚効果を説明する絵コンテ`;
      termDialog.showModal();
    }

    content.addEventListener("click", event => {
      const card = event.target.closest(".term-card");
      if (card) openTerm(Number(card.dataset.term));
    });
    content.addEventListener("keydown", event => {
      const card = event.target.closest(".term-card");
      if (card && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openTerm(Number(card.dataset.term));
      }
    });
    dialogClose.addEventListener("click", () => termDialog.close());
    termDialog.addEventListener("click", event => {
      const rect = termDialog.getBoundingClientRect();
      const outside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
      if (outside) termDialog.close();
    });

    videoToggle.addEventListener("click", () => {
      if (heroVideo.paused) {
        heroVideo.play();
        videoToggle.textContent = "Pause film";
        videoToggle.setAttribute("aria-pressed", "false");
        videoToggle.setAttribute("aria-label", "背景動画を一時停止");
      } else {
        heroVideo.pause();
        videoToggle.textContent = "Play film";
        videoToggle.setAttribute("aria-pressed", "true");
        videoToggle.setAttribute("aria-label", "背景動画を再生");
      }
    });

    filters.addEventListener("click", event => {
      const button = event.target.closest("button[data-axis]");
      if (!button) return;
      selectedAxis = button.dataset.axis;
      renderFilters();
      render();
      document.querySelector(".toolbar").scrollIntoView({ behavior: "smooth" });
    });
    search.addEventListener("input", render);

    renderFilters();
    render();
    if (location.hash) {
      document.querySelector(location.hash)?.scrollIntoView();
    }
  </script>
</body>
